# Missing-checkpoint alert (recovery-runbook.md): every half hour, fails when the newest protected checkpoint
# artifact is older than 90 minutes, which emails the workflow's committer. Quiet until the first capture has ever
# uploaded one, so an unconfigured environment does not page anyone.
name: Checkpoint watchdog
on:
  schedule:
    - cron: '47,17 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Age of the newest successful checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a real capture uploads an artifact; an unconfigured capture job ends successfully without one.
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("protected-checkpoint-")) and (.expired | not)) | .created_at] | sort | last // empty')
          if [ -z "$latest" ]; then
            echo "No checkpoint artifact yet; nothing to guard."
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          echo "Newest successful checkpoint: $latest ($((age / 60)) minutes ago)"
          if [ "$age" -gt 5400 ]; then
            echo "::error::No successful protected checkpoint in the last 90 minutes."
            exit 1
          fi
